<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>DARCO Memory Machine</title>
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #D4A373;
            --card-bg: #1E1E1E;
            --text-color: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        /* Home Screen */
        #admin-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            z-index: 10;
        }

        .logo-placeholder {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--accent-color);
            margin-bottom: 2rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 18px 48px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 36px;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Camera Screen */
        #camera-view {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12rem;
            font-weight: bold;
            color: white;
            pointer-events: none;
        }

        /* Processing & Success */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Admin Modal & Dashboard */
        .admin-modal {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .admin-modal input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121212;
            color: white;
        }

        .admin-dashboard {
            width: 100%;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            background: #181818;
            box-sizing: border-box;
        }

        .setting-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .setting-group input[type="range"] {
            width: 100%;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="proc-canvas"></canvas>

    <div id="home-screen" class="screen active">
        <div id="admin-trigger"></div>
        <div class="logo-placeholder">DARCO</div>
        <div style="font-size: 5rem; margin-bottom: 20px;">📸</div>
        <h1 style="margin-bottom: 40px; font-weight: 300;">عکس یادگاری بگیر</h1>
        <button class="btn" onclick="startCamera()">[ شروع ]</button>
    </div>

    <div id="camera-screen" class="screen">
        <video id="camera-view" autoplay playsinline></video>
        <div id="countdown" class="countdown-overlay">3</div>
    </div>

    <div id="processing-screen" class="screen">
        <div class="spinner"></div>
        <h2 id="status-text">در حال آماده‌سازی تصویر...</h2>
    </div>

    <div id="success-screen" class="screen">
        <div style="font-size: 5rem; margin-bottom: 20px;">☕</div>
        <h2>عکس شما آماده‌ست!</h2>
    </div>

    <div id="admin-pin-screen" class="screen">
        <div class="admin-modal">
            <h3>ورود به پنل مدیریت</h3>
            <input type="password" id="admin-pin-input" placeholder="کد PIN را وارد کنید">
            <button class="btn" style="font-size: 1rem; padding: 10px 20px;" onclick="checkAdminPin()">ورود</button>
            <button class="btn" style="font-size: 1rem; padding: 10px 20px; background: #444; color: white;" onclick="showScreen('home-screen')">انصراف</button>
        </div>
    </div>

    <div id="admin-dashboard" class="screen">
        <div class="admin-dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>تنظیمات DARCO Memory Machine</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background: #4CAF50; color: white; font-size: 1rem; padding: 8px 16px;" onclick="showScreen('gallery-screen')">📸 گالری</button>
                    <button class="btn" style="background: red; color: white; font-size: 1rem; padding: 8px 16px;" onclick="showScreen('home-screen')">خروج</button>
                </div>
            </div>

            <div class="setting-group">
                <h3>اتصال پرینتر USB</h3>
                <p style="color: #aaa; margin: 10px 0; font-size: 0.9rem;">پرینتر حرارتی NB-P80 را متصل کرده و دکمه زیر را بزنید:</p>
                <button class="btn" style="font-size: 1rem; padding: 10px 20px;" onclick="connectUsbPrinter()">[ اتصال به پرینتر USB ]</button>
                <p id="printer-status" style="margin-top: 10px; color: var(--accent-color);">وضعیت: متصل نشده</p>
            </div>

            <div class="setting-group">
                <label>کنتراست تصویر: <span id="contrast-val">1.2</span></label>
                <input type="range" id="contrast-slider" min="0.5" max="2.5" step="0.1" value="1.2" oninput="updateSettings()">
            </div>

            <div class="setting-group">
                <label>متن زیرنویس (Footer):</label>
                <input type="text" id="footer-input" value="THANK YOU FOR VISITING DARCO" style="width: 100%; padding: 8px; margin-top: 5px;" onchange="updateSettings()">
            </div>

            <button class="btn" style="font-size: 1rem; padding: 10px 20px;" onclick="testPrint()">تست پرینت</button>
        </div>
    </div>

    <div id="gallery-screen" class="screen">
        <div class="admin-dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>گالری عکس‌ها</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background: #ff9800; color: white; font-size: 1rem; padding: 8px 16px;" onclick="deleteAllPhotos()">حذف همه</button>
                    <button class="btn" style="background: red; color: white; font-size: 1rem; padding: 8px 16px;" onclick="showScreen('admin-dashboard')">بازگشت</button>
                </div>
            </div>
            <div id="gallery-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%;">
            </div>
        </div>
    </div>

    <script>
        let settings = {
            pin: "1234",
            contrast: 1.2,
            footerText: "THANK YOU FOR VISITING DARCO",
            countdown: 3
        };

        let usbDevice = null;
        let usbEndpointOut = null;
        let tapCount = 0;

        document.getElementById('admin-trigger').addEventListener('click', () => {
            tapCount++;
            if (tapCount >= 5) {
                tapCount = 0;
                showScreen('admin-pin-screen');
            }
        });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function checkAdminPin() {
            const input = document.getElementById('admin-pin-input').value;
            if (input === settings.pin) {
                document.getElementById('admin-pin-input').value = '';
                showScreen('admin-dashboard');
            } else {
                alert('کد اشتباه است!');
            }
        }

        function updateSettings() {
            settings.contrast = parseFloat(document.getElementById('contrast-slider').value);
            document.getElementById('contrast-val').innerText = settings.contrast;
            settings.footerText = document.getElementById('footer-input').value;
        }

        async function startCamera() {
            showScreen('camera-screen');
            const video = document.getElementById('camera-view');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;

                let count = settings.countdown;
                const countdownEl = document.getElementById('countdown');
                countdownEl.innerText = count;

                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.innerText = count;
                    } else {
                        clearInterval(interval);
                        capturePhoto(video, stream);
                    }
                }, 1000);

            } catch (err) {
                alert('دسترسی به دوربین داده نشد یا مسدود شده است.');
                showScreen('home-screen');
            }
        }

        function capturePhoto(video, stream) {
            const canvas = document.getElementById('proc-canvas');
            const ctx = canvas.getContext('2d');
            
            const size = Math.min(video.videoWidth, video.videoHeight);
            canvas.width = 576;
            canvas.height = 576;

            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, -576, 0, 576, 576);
            ctx.restore();

            stream.getTracks().forEach(track => track.stop());

            processAndPrintImage();
        }

        function processAndPrintImage() {
            showScreen('processing-screen');
            document.getElementById('status-text').innerText = "در حال آماده‌سازی عکس...";

            setTimeout(() => {
                const canvas = document.getElementById('proc-canvas');
                const ctx = canvas.getContext('2d');

                const oldData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                canvas.height = 576 + 140;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.putImageData(oldData, 0, 0);

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("DARCO", canvas.width / 2, 576 + 35);

                ctx.font = '20px sans-serif';
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-GB') + '  ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                ctx.fillText(dateStr, canvas.width / 2, 576 + 75);

                if (settings.footerText) {
                    ctx.font = '16px sans-serif';
                    ctx.fillText(settings.footerText, canvas.width / 2, 576 + 110);
                }

                applyFloydSteinbergDithering(canvas, ctx, settings.contrast);

                document.getElementById('status-text').innerText = "در حال ارسال به پرینتر...";
                sendToPrinter(canvas);
            }, 300);
        }

        function applyFloydSteinbergDithering(canvas, ctx, contrast) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            for (let i = 0; i < data.length; i += 4) {
                let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                gray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
                gray = Math.min(255, Math.max(0, gray));
                data[i] = data[i+1] = data[i+2] = gray;
            }

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    let oldPixel = data[idx];
                    let newPixel = oldPixel < 128 ? 0 : 255;
                    data[idx] = data[idx+1] = data[idx+2] = newPixel;

                    let err = oldPixel - newPixel;

                    if (x + 1 < width) data[idx + 4] += err * (7 / 16);
                    if (x - 1 >= 0 && y + 1 < height) data[idx + (width - 1) * 4] += err * (3 / 16);
                    if (y + 1 < height) data[idx + width * 4] += err * (5 / 16);
                    if (x + 1 < width && y + 1 < height) data[idx + (width + 1) * 4] += err * (1 / 16);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        async function connectUsbPrinter() {
            try {
                if (navigator.usb) {
                    // Seiko Instruments NB-P80 printer
                    // Vendor ID: 0x0B8C, Product ID: varies (user selects)
                    const filters = [
                        { vendorId: 0x0B8C, productId: 0x0202 }, // Common NB-P80
                        { vendorId: 0x0B8C }, // Any Seiko device
                        { } // Allow user to select manually
                    ];
                    
                    usbDevice = await navigator.usb.requestDevice({ filters: filters });
                    
                    if (!usbDevice) {
                        alert('❌ پرینتری انتخاب نشد');
                        return;
                    }

                    // Open device
                    await usbDevice.open();
                    
                    // Select first configuration
                    if (usbDevice.configuration === null) {
                        await usbDevice.selectConfiguration(1);
                    }
                    
                    // Claim interface
                    const interfaceObj = usbDevice.configuration.interfaces[0];
                    if (!interfaceObj.claimed) {
                        await usbDevice.claimInterface(interfaceObj.interfaceNumber);
                    }

                    // Find output endpoint
                    usbEndpointOut = interfaceObj.alternate.endpoints.find(e => e.direction === 'out');

                    if (!usbEndpointOut) {
                        alert('❌ خطا: نقطه نهایی خروجی پیدا نشد');
                        return;
                    }

                    // Success
                    const printerName = usbDevice.productName || 'Seiko NB-P80';
                    document.getElementById('printer-status').innerText = `✅ متصل شد: ${printerName}`;
                    document.getElementById('printer-status').style.color = '#4CAF50';
                    alert(`✅ پرینتر متصل شد!\n\n${printerName}\n\nحالا عکس بگیر - خودکار چاپ میشه.`);
                } else {
                    alert('❌ مرورگرت Web USB پشتیبانی نمی‌کنه\n\nاز Chrome یا Edge استفاده کن');
                }
            } catch (err) {
                if (err.name === 'NotFoundError') {
                    alert('❌ پرینتر پیدا نشد\n\n✅ USB رو درست وصل کن\n✅ پرینتر روشن باشه\n✅ دایور نصب باشه');
                } else if (err.name === 'SecurityError') {
                    alert('❌ خطای امنیتی در دسترسی USB');
                } else if (err.name === 'NetworkError') {
                    alert('❌ پرینتر قطع شد');
                } else {
                    alert('❌ خطا: ' + err.message);
                }
            }
        }

        async function printViaSystemPrinter(canvas) {
            try {
                // Try to get NB-P80 printer info using Web Printing API
                if (navigator.getBattery) {
                    const ctx = canvas.getContext('2d');
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const commands = buildEscPosImageCommands(imgData, canvas.width, canvas.height);
                    
                    if (usbDevice && usbEndpointOut) {
                        await usbDevice.transferOut(usbEndpointOut.endpointNumber, commands);
                        console.log('طباعة مباشرة للطابعة');
                    }
                }
            } catch (err) {
                console.log('خطا في الطباعة المباشرة');
            }
        }

        async function sendToPrinter(canvas) {
            document.getElementById('status-text').innerText = "در حال ذخیره‌سازی عکس...";

            // Save photo to downloads
            await savePhotoToDownloads(canvas);

            if (usbDevice && usbEndpointOut) {
                document.getElementById('status-text').innerText = "در حال چاپ...";
                
                try {
                    const ctx = canvas.getContext('2d');
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const commands = buildEscPosImageCommands(imgData, canvas.width, canvas.height);
                    
                    await usbDevice.transferOut(usbEndpointOut.endpointNumber, commands);
                    
                    showScreen('success-screen');
                    setTimeout(() => {
                        showScreen('home-screen');
                    }, 4000);
                } catch (err) {
                    document.getElementById('status-text').innerText = "خطا در چاپ: " + err.message;
                    setTimeout(() => {
                        showScreen('home-screen');
                    }, 3000);
                }
            } else {
                // Printer not connected, just show success for saved photo
                showScreen('success-screen');
                setTimeout(() => {
                    showScreen('home-screen');
                }, 4000);
            }
        }

        async function savePhotoToDownloads(canvas) {
            // Convert canvas to compressed image
            const link = document.createElement('a');
            // Use JPEG format with 70% quality for smaller file size
            const imageData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Create filename with timestamp
            const now = new Date();
            const timestamp = now.getFullYear() + 
                            String(now.getMonth() + 1).padStart(2, '0') + 
                            String(now.getDate()).padStart(2, '0') + '_' +
                            String(now.getHours()).padStart(2, '0') +
                            String(now.getMinutes()).padStart(2, '0') +
                            String(now.getSeconds()).padStart(2, '0');
            
            link.href = imageData;
            link.download = `DARCO_${timestamp}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function buildEscPosImageCommands(imgData, width, height) {
            // Seiko NB-P80 ESC/POS commands
            const bytesPerLine = Math.ceil(width / 8);
            
            // Build command array
            let commands = [];
            
            // ESC @ - Initialize printer
            commands.push(0x1B, 0x40);
            
            // GS v 0 - Print raster bitmap (NB-P80 specific)
            commands.push(0x1D, 0x76, 0x30, 0x00);
            
            // Width (in bytes, little-endian)
            commands.push(bytesPerLine & 0xFF, (bytesPerLine >> 8) & 0xFF);
            
            // Height (in pixels, little-endian)
            commands.push(height & 0xFF, (height >> 8) & 0xFF);
            
            // Image data - convert to bitmap
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x += 8) {
                    let byteVal = 0;
                    for (let bit = 0; bit < 8; bit++) {
                        if (x + bit < width) {
                            let idx = (y * width + (x + bit)) * 4;
                            // Check if pixel is black (dark)
                            let brightness = (imgData.data[idx] + imgData.data[idx+1] + imgData.data[idx+2]) / 3;
                            if (brightness < 128) {
                                byteVal |= (0x80 >> bit); // Set bit for black pixel
                            }
                        }
                    }
                    commands.push(byteVal);
                }
            }
            
            // CR LF - Line feed
            commands.push(0x0D, 0x0A);
            
            // FF - Form feed (for photo paper)
            commands.push(0x0C);

            return new Uint8Array(commands);
        }

        async function testPrint() {
            const canvas = document.getElementById('proc-canvas');
            canvas.width = 576;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("DARCO MEMORY MACHINE OK", 288, 60);

            sendToPrinter(canvas);
        }
    </script>
</body>
</html>
